[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hypanel"
version = "0.1.0"
description = "Self-hosted Hytale server management for Docker and Unraid"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "docker>=7.1,<8", "python-multipart>=0.0.20,<1", "argon2-cffi>=23.1,<26", "croniter>=6,<7", "psutil>=6,<8", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
